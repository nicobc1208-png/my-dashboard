  </div>

  <div class="sect">${sectionHead('Progress photos', ['+ Photo', 'addPhoto()'])}
    ${photos.length ? `<div class="pgrid">${photos.slice(0, 12).map(p => `
      <figure><img src="${p.data}" alt="${esc(p.date)}" loading="lazy">
        <button class="del" onclick="delPhoto('${p.id}')">✕</button>
        <figcaption>${esc(fmtD(p.date))}</figcaption></figure>`).join('')}</div>`
    : `<div class="card"><div class="empty">Same lighting, same pose, same time of day.<br>Every 2 weeks is plenty on a bulk.</div></div>`}
    <input type="file" id="photoIn" accept="image/*" class="hidden">
  </div>

  <div class="sect">${sectionHead('This month')}
    <div class="card">
      <div class="kv"><span class="kv-k">Sessions</span><span class="kv-v">${new Set(ws.map(w => w.date)).size}</span></div>
      <div class="kv"><span class="kv-k">Total volume</span><span class="kv-v">${round(sum(ws.map(volOf))).toLocaleString()} ${DB.profile.unit}</span></div>
      <div class="kv"><span class="kv-k">Calorie target hit</span><span class="kv-v">${days.filter(k => nutTotals(k).kcal >= DB.nutTarget.kcal * .95).length} days</span></div>
      <div class="kv"><span class="kv-k">Protein target hit</span><span class="kv-v">${days.filter(k => nutTotals(k).p >= DB.nutTarget.p).length} days</span></div>
      <div class="kv"><span class="kv-k">New PRs</span><span class="kv-v">${DB.prs.filter(p => p.date.startsWith(mk)).length}</span></div>
      <div class="kv"><span class="kv-k">Weight change</span><span class="kv-v">${(() => {
        const m = DB.weights.filter(w => w.date.startsWith(mk));
        return m.length > 1 ? (m[m.length - 1].w - m[0].w > 0 ? '+' : '') + round(m[m.length - 1].w - m[0].w, 1) + ' ' + DB.profile.unit : '—';
      })()}</span></div>
    </div>
  </div>`;
}
function addPhoto() {
  const inp = $('photoIn'); if (!inp) return;
  inp.onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const img = new Image(), rd = new FileReader();
    rd.onload = ev => {
      img.onload = () => {
        const max = 620, sc = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        DB.photos.push({ id: uid(), date: today(), data: cv.toDataURL('image/jpeg', .72), note: '' });
        save(); toast('Photo saved');
      };
      img.src = ev.target.result;
    };
    rd.readAsDataURL(f); inp.value = '';
  };
  inp.click();
}
function delPhoto(id) { askConfirm('Delete this photo?', () => { DB.photos = DB.photos.filter(p => p.id !== id); save(); }); }

function bizCalls() {

  const wkTot = wk.reduce((a, k) => {
    const x = DB.calls[k] || {};
    return { dials: a.dials + (x.dials || 0), conn: a.conn + (x.conn || 0), booked: a.booked + (x.booked || 0) };
  }, { dials: 0, conn: 0, booked: 0 });
  const connRate = wkTot.dials ? round(wkTot.conn / wkTot.dials * 100) : 0;
  const bookRate = wkTot.conn ? round(wkTot.booked / wkTot.conn * 100) : 0;

  const counter = (lbl, key, val, color) => `
    <div class="card pad-sm tc">
      <div class="eyebrow">${lbl}</div>
      <div class="big sm" style="margin:8px 0;color:${color}">${val}</div>
      <div class="row" style="gap:6px">
        <button class="btn btn-sm grow" onclick="callAdj('${key}',-1)">−</button>
        <button class="btn btn-sm grow" onclick="callAdj('${key}',1)">+</button>

  return `
  <div class="card accent mb" style="--_c:var(--biz)">
    <div class="row" style="gap:16px;align-items:center">

      </div>
    </div>
  </div>

  <div class="grid g3 mb">
    ${counter('Dials', 'dials', c.dials || 0, 'var(--biz)')}
    ${counter('Connects', 'conn', c.conn || 0, 'var(--money)')}
    ${counter('Booked', 'booked', c.booked || 0, 'var(--fit)')}
  </div>

  <div class="sect">${sectionHead('This week')}
    <div class="card">
      <div class="kv"><span class="kv-k">Dials</span><span class="kv-v">${wkTot.dials}</span></div>
      <div class="kv"><span class="kv-k">Connects</span><span class="kv-v">${wkTot.conn} · ${connRate}%</span></div>
      <div class="kv"><span class="kv-k">Appointments booked</span><span class="kv-v">${wkTot.booked} · ${bookRate}% of connects</span></div>
      <div class="kv"><span class="kv-k">Dials per booking</span><span class="kv-v">${wkTot.booked ? round(wkTot.dials / wkTot.booked, 1) : '—'}</span></div>
    </div>
  </div>

  <div class="sect">${sectionHead('Daily dials · 14 days')}
    <div class="card">${barChart(lastN(14).map(k => ({
      label: new Date(k + 'T12:00:00').getDate() % 5 === 0 ? String(new Date(k + 'T12:00:00').getDate()) : '',
      val: (DB.calls[k] || {}).dials || 0
    })), { color: 'var(--biz)', target: 20, h: 110 })}</div>
  </div>

  <div class="sect">${sectionHead('The math')}
    <div class="card">
      <div class="sub" style="line-height:1.7">
        At ${connRate || 20}% connect and ${bookRate || 15}% booking, every
        <b style="color:var(--biz)">${wkTot.booked ? round(wkTot.dials / wkTot.booked) : 33} dials</b>
        buys you one appointment. You don't control who says yes — you control the dial count.
      </div>
    </div>
  </div>`;
}
function callAdj(key, n) {
  const d = today(), c = DB.calls[d] || { dials: 0, conn: 0, booked: 0 };
  c[key] = Math.max(0, (c[key] || 0) + n);
  DB.calls[d] = c; haptic();
  if (key === 'dials' && c.dials === 20) toast('☎️ 20 dials — target hit');
  logScore(); save();
}

/* ── REVENUE ──────────────────────────────────────────────────── */
function bizRev() {

  const lastRev = sum(DB.revenue.filter(r => r.date.startsWith(lastMk)).map(r => r.amt));
  const delta = lastRev ? round((monthRev - lastRev) / lastRev * 100) : 0;
  const allTime = sum(DB.revenue.map(r => r.amt));
  const goal = DB.goals.find(g => g.dom === 'biz' && !g.done && g.unit === '$');
  const rungs = [1000, 2500, 5000, 10000, 20000];
  const nextRung = rungs.find(r => monthRev < r) || 20000;

  const byVenture = DB.ventures.map(([id, lbl]) => ({
    lbl, val: sum(DB.revenue.filter(r => r.biz === id && r.date.startsWith(mk)).map(r => r.amt))
  })).filter(v => v.val > 0);

  const months = [];
  for (let i = 5; i >= 0; i--) {
    const dt = new Date(); dt.setMonth(dt.getMonth() - i);
    const k = dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0');
    months.push({ label: MON[dt.getMonth()], val: sum(DB.revenue.filter(r => r.date.startsWith(k)).map(r => r.amt)) });
  }

  return `
  <div class="card accent mb" style="--_c:var(--biz)">
    <div class="eyebrow">${MON[new Date().getMonth()]} revenue</div>
    <div class="row" style="align-items:baseline;gap:10px;margin-top:6px">
      <div class="big">${kmoney(monthRev)}</div>
      ${lastRev ? `<span class="delta ${delta >= 0 ? 'up' : 'dn'}">${delta >= 0 ? '+' : ''}${delta}%</span>` : ''}
    </div>
    <div class="li-s">All time ${kmoney(allTime)}${lastRev ? ' · last month ' + kmoney(lastRev) : ''}</div>
    <div class="row mt-sm" style="gap:6px"><span class="pill" style="--_c:var(--fit)">MRR ${kmoney(mrr())}</span>
      <span class="pill" style="--_c:var(--biz)">one-off ${kmoney(monthRev - mrr())}</span></div>
    ${goal ? `<div class="mt"><div class="bar" style="--_c:var(--biz)"><span style="width:${pct(monthRev, goal.target)}%"></span></div>
      <div class="li-s" style="margin-top:6px">${esc(goal.title)} — ${kmoney(monthRev)} of ${kmoney(goal.target)}</div></div>` : ''}
    <button class="btn btn-accent btn-block mt" style="--_c:var(--biz)" onclick="revSheet()">+ Log revenue</button>
  </div>

  <div class="card mb" style="--_c:var(--biz)">
    <div class="eyebrow">Road to $10k/month</div>
    <div class="li-s" style="margin:7px 0 10px">Your floor is $10k. Next rung: ${kmoney(nextRung)} — that's ${kmoney(Math.max(0, nextRung - monthRev))} more this month.</div>
    ${rungs.map(r => `<div class="row" style="gap:9px;margin-bottom:6px">
      <div class="fs11 muted num" style="width:42px;flex:0 0 auto">${kmoney(r)}</div>
      <div class="bar thin grow" style="--_c:${monthRev >= r ? 'var(--fit)' : 'var(--biz)'}"><span style="width:${pct(monthRev, r)}%"></span></div>
      <div style="width:16px;flex:0 0 auto;text-align:right">${monthRev >= r ? '✅' : ''}</div></div>`).join('')}

/* MRR = the retainers still live this month. Automations are the compounding half. */
function mrr() {
  const seen = {};
  DB.revenue.filter(r => r.kind === 'monthly').forEach(r => {

  return sum(Object.values(seen).map(r => r.amt));
}

/* ═══════════════════════════════════════════════════════════════════
   MONEY — net worth · cashflow · savings · budget · subscriptions
   ═══════════════════════════════════════════════════════════════════ */
const CATS = ['Food', 'Gym', 'Car', 'Gas', 'Subscriptions', 'Gear', 'Going out', 'School', 'Business', 'Other'];
const CAT_ICON = { Food: '🍽️', Gym: '🏋️', Car: '🚗', Gas: '⛽', Subscriptions: '🔁',
  Gear: '🎧', 'Going out': '🎟️', School: '📚', Business: '💼', Other: '•' };

function monthIn(mk) {
  return sum(DB.tx.filter(t => t.type === 'in' && t.date.startsWith(mk)).map(t => t.amt)) +
         sum(DB.revenue.filter(r => r.date.startsWith(mk)).map(r => r.amt));
}
function monthOut(mk) { return sum(DB.tx.filter(t => t.type === 'out' && t.date.startsWith(mk)).map(t => t.amt)); }
function netWorth() {
  return sum(DB.assets.filter(a => a.type !== 'debt').map(a => a.val)) -
         sum(DB.assets.filter(a => a.type === 'debt').map(a => a.val));
}

RENDERERS.money = function () {
  const sub = DB.ui.sub.money || 'over';
  const s = scores();
  const head = pageHead('Money', `Life score contribution · ${s.money}/100`,
    ring(s.money, { size: 52, sw: 5, color: 'var(--money)', val: s.money, vs: 15 }));
  const nav = segNav('money', [['over', 'Overview'], ['flow', 'Flow'], ['save', 'Savings'], ['budget', 'Budget'], ['subs', 'Subs']], sub);
  return head + nav + ({ over: mnOver, flow: mnFlow, save: mnSave, budget: mnBudget, subs: mnSubs }[sub] || mnOver)();
};

/* ── OVERVIEW ─────────────────────────────────────────────────── */

  return `
  <div class="card accent mb" style="--_c:var(--money)">

    </div>
    <div class="li-s">${kmoney(totalA)} assets · ${kmoney(sum(debts.map(d => d.val)))} owed</div>
    ${log.length > 1 ? `<div class="mt">${sparkline(log.map(l => l.val), 'var(--money)', 42)}</div>` : ''}
    <div class="row mt" style="gap:8px">

      <div class="tile-l">this month</div></div>
    <div class="card pad-sm"><div class="eyebrow">Out</div>
      <div class="tile-v" style="margin-top:6px;color:var(--danger)">${kmoney(mOut)}</div>
      <div class="tile-l">this month</div></div>
    <div class="card pad-sm"><div class="eyebrow">Saved</div>
      <div class="tile-v" style="margin-top:6px;color:${rate >= 20 ? 'var(--fit)' : 'var(--warning)'}">${rate}<small style="font-size:13px">%</small></div>
      <div class="tile-l">of income</div></div>
  </div>

  <div class="sect">${sectionHead('Assets')}
    <div class="card">${assets.length ? assets.map(a => `
      <div class="li" onclick="assetSheet('${a.id}')" style="cursor:pointer">
        <div class="li-main"><div class="li-t">${esc(a.name)}</div>
        <div class="li-s">${esc(a.type || 'cash')}</div></div>
        <div class="num fs14" style="font-weight:650">${money(a.val)}</div></div>`).join('')
      : `<div class="empty">Add your accounts to see net worth build in real time.</div>`}</div>
  </div>

  ${debts.length ? `<div class="sect">${sectionHead('Debts')}
    <div class="card">${debts.map(a => `
      <div class="li" onclick="assetSheet('${a.id}')" style="cursor:pointer">
        <div class="li-main"><div class="li-t">${esc(a.name)}</div></div>
        <div class="num fs14" style="font-weight:650;color:var(--danger)">−${money(a.val)}</div></div>`).join('')}</div>
  </div>` : ''}`;
}

/* ── FLOW ─────────────────────────────────────────────────────── */

  const days = lastN(14).map(k => ({

  }));

  return `
  <div class="row mb" style="gap:8px">

        </div>
        <div class="bar thin" style="--_c:var(--money)"><span style="width:${pct(c.val, byCat[0].val)}%"></span></div>
      </div>`).join('') : `<div class="empty">No spending logged this month.</div>`}</div>
  </div>

  <div class="sect">${sectionHead('Recent transactions')}
    <div class="card">${recent.length ? recent.map(t => `
      <div class="li"><span style="font-size:15px">${t.type === 'in' ? '💰' : (CAT_ICON[t.cat] || '•')}</span>
        <div class="li-main"><div class="li-t">${esc(t.note || t.cat || 'Transaction')}</div>
        <div class="li-s">${fmtD(t.date)}${t.cat ? ' · ' + esc(t.cat) : ''}</div></div>
        <div class="num fs13" style="font-weight:650;color:${t.type === 'in' ? 'var(--fit)' : 'var(--text)'}">
          ${t.type === 'in' ? '+' : '−'}${money(t.amt)}</div>
        <button class="x" onclick="delTx('${t.id}')">✕</button></div>`).join('')

  </div>`;
}

    { k: 'cat', l: 'Category', type: 'select', opts: CATS, v: type === 'in' ? 'Other' : 'Food' },
    { k: 'note', l: 'Note', ph: 'What was it?' },
    { k: 'date', l: 'Date', type: 'date', v: today() },

function delTx(id) { DB.tx = DB.tx.filter(t => t.id !== id); save(); }

/* ── SAVINGS POTS ─────────────────────────────────────────────── */
function mnSave() {
  const total = sum(DB.pots.map(p => p.saved)), target = sum(DB.pots.map(p => p.target));
  return `
  <div class="card accent mb" style="--_c:var(--money)">
    <div class="eyebrow">Total saved</div>
    <div class="big" style="margin-top:6px">${money(sum(DB.assets.filter(a => ['cash','savings','invest'].includes(a.type)).map(a => a.val)))}</div>
    <div class="li-s">Across your cash, savings and investments</div>
    <div class="sub mt" style="line-height:1.6">You said you're saving without a target. That works — but a number
      with a date behind it saves faster than one without. Add one below whenever you're ready.</div>
  </div>

  ${DB.pots.length ? `<div class="card mb" style="--_c:var(--money)">
    <div class="eyebrow">Total saved toward goals</div>
    <div class="big" style="margin-top:6px">${money(total)}</div>
    <div class="li-s">of ${money(target)} across ${DB.pots.length} goal${DB.pots.length === 1 ? '' : 's'}</div>
    <div class="bar mt" style="--_c:var(--money)"><span style="width:${pct(total, target)}%"></span></div>

  <button class="btn btn-accent btn-block mb" style="--_c:var(--money)" onclick="potSheet()">+ New savings goal</button>

  ${DB.pots.length ? DB.pots.map(p => {
    const pr = pct(p.saved, p.target);
    const left = Math.max(0, p.target - p.saved);
    const perMonth = p.due ? Math.max(1, Math.ceil(daysBetween(today(), p.due) / 30)) : null;
    return `<div class="card mb">
      <div class="card-h">
        <div><div class="card-t">${esc(p.icon || '🎯')} ${esc(p.name)}</div>

      </div>
      <div class="bar" style="--_c:var(--money)"><span style="width:${pr}%"></span></div>
      ${perMonth && left > 0 ? `<div class="li-s" style="margin-top:8px">Put away ${money(Math.ceil(left / perMonth))}/month to land on time</div>` : ''}

function potSheet(id) {
  const p = id ? DB.pots.find(x => x.id === id) : null;

    { k: 'name', l: 'What for?', v: p?.name, ph: 'Car, camera, emergency fund…' },

    { k: 'target', l: 'Target amount', type: 'number', v: p?.target, step: 'any' },

}
function potAdd(id) {

  formSheet('Deposit · ' + p.name, [{ k: 'amt', l: 'Amount', type: 'number', step: 'any' }], o => {
    if (!o.amt) return;

}
function delPot(id) { DB.pots = DB.pots.filter(p => p.id !== id); save(); }

/* ── BUDGET ───────────────────────────────────────────────────── */
function mnBudget() {
  const mk = monthKey();
  const rows = CATS.map(c => {
    const limit = DB.budget[c] || 0;
    const spent = sum(DB.tx.filter(t => t.type === 'out' && t.cat === c && t.date.startsWith(mk)).map(t => t.amt));
    return { c, limit, spent };
  }).filter(r => r.limit > 0 || r.spent > 0);
  const totLimit = sum(rows.map(r => r.limit)), totSpent = sum(rows.map(r => r.spent));
  const dayOfMonth = new Date().getDate();
  const daysInMonth = new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0).getDate();
  const paceExpected = totLimit * (dayOfMonth / daysInMonth);

  return `
  ${totLimit > 0 ? `<div class="card accent mb" style="--_c:${totSpent > paceExpected ? 'var(--warning)' : 'var(--money)'}">
    <div class="eyebrow">Budget used</div>
    <div class="row" style="align-items:baseline;gap:10px;margin-top:6px">
      <div class="big">${money(totSpent)}</div>
      <div class="sub muted">of ${money(totLimit)}</div>
    </div>
    <div class="bar mt" style="--_c:${totSpent > totLimit ? 'var(--danger)' : 'var(--money)'}">
      <span style="width:${pct(totSpent, totLimit)}%"></span></div>
    <div class="li-s" style="margin-top:8px">
      Day ${dayOfMonth}/${daysInMonth} · on pace you'd be at ${money(paceExpected)} —
      ${totSpent > paceExpected ? `you're ${money(totSpent - paceExpected)} ahead of pace` : `you're ${money(paceExpected - totSpent)} under pace`}
    </div>
  </div>` : ''}

  <button class="btn btn-accent btn-block mb" style="--_c:var(--money)" onclick="budgetSheet()">Set monthly limits</button>

  <div class="sect">${sectionHead('By category')}
    <div class="card">${rows.length ? rows.map(r => {
      const p = r.limit ? pct(r.spent, r.limit) : 0;
      const over = r.limit && r.spent > r.limit;
      return `<div style="margin-bottom:15px">
        <div class="row" style="justify-content:space-between;margin-bottom:6px">
          <div class="fs13">${CAT_ICON[r.c] || '•'} ${esc(r.c)}</div>
          <div class="num fs12 ${over ? '' : 'muted'}" style="${over ? 'color:var(--danger)' : ''}">
            ${money(r.spent)}${r.limit ? ' / ' + money(r.limit) : ''}</div>
        </div>
        <div class="bar thin" style="--_c:${over ? 'var(--danger)' : 'var(--money)'}"><span style="width:${p}%"></span></div>
      </div>`;
    }).join('') : `<div class="empty">Set limits and every expense you log lands in the right bucket.</div>`}</div>
  </div>`;
}
function budgetSheet() {
  const keys = CATS.map((c, i) => ['c' + i, c]);
  formSheet('Monthly limits', keys.map(([k, c]) => ({ k, l: c, type: 'number', v: DB.budget[c] || '' })),
    o => { keys.forEach(([k, c]) => { if (o[k]) DB.budget[c] = o[k]; else delete DB.budget[c]; }); logScore(); save(); });
}

/* ── SUBSCRIPTIONS ────────────────────────────────────────────── */
function mnSubs() {
  const monthly = sum(DB.subs.map(s => s.cycle === 'year' ? s.amt / 12 : s.cycle === 'week' ? s.amt * 4.33 : s.amt));
  const upcoming = [...DB.subs].filter(s => s.next).sort((a, b) => a.next.localeCompare(b.next));
  return `

  <div class="row mb" style="gap:8px">

    <button class="btn grow" onclick="examSheet()">+ Exam</button>

  <div class="sect">${sectionHead('Due next')}

  ${exams.length ? `<div class="sect">${sectionHead('Exams')}
    <div class="card">${exams.map(e => `
      <div class="li" onclick="examSheet('${e.id}')" style="cursor:pointer">
        <span style="font-size:15px">📝</span>

          <div class="li-s">${esc(e.course || '')} · ${fmtDW(e.date)}</div></div>
        <span class="delta ${relDue(e.date).tone}">${relDue(e.date).txt}</span></div>`).join('')}</div>

          <button class="ck" style="--_c:var(--school)" onclick="toggleCollege('${c.id}')"></button>
          <div class="li-main" onclick="collegeSheet('${c.id}')" style="cursor:pointer">
            <div class="li-t">${esc(c.t)}</div>${c.note ? `<div class="li-s">${esc(c.note)}</div>` : ''}</div>
          ${r ? `<span class="delta ${r.tone}">${r.txt}</span>` : ''}</div>`;
      }).join('') : `<div class="empty">Applications, essays, campus visits, scholarships, test dates —<br>break it into steps so it never becomes a panic.</div>`}
      ${collegeDone ? `<div class="li-s tc mt">${collegeDone} step${collegeDone === 1 ? '' : 's'} done ✅</div>` : ''}

/* ── MUSIC ────────────────────────────────────────────────────── */
const FOCUS_AREAS = [
  ['rudiments', 'Rudiments', 'Singles, doubles, paradiddles — metronome on, no exceptions.'],
  ['independence', 'Independence', 'Four-way coordination. One pattern, drilled slow.'],
  ['groove', 'Groove & pocket', 'Sit behind the beat. Feel over fills.'],
  ['fills', 'Fills & chops', 'Build vocabulary — then learn when not to use it.'],
  ['songs', 'Song play-along', 'Front to back, no stopping. Dynamics matter.'],
  ['reading', 'Sight reading', 'Read a chart cold. Do not repeat sections.'],
  ['freeplay', 'Free play', 'No rules. Record it and listen back.'],
];
const focusLabel = k => (FOCUS_AREAS.find(f => f[0] === k) || [, 'Free play'])[1];
const SONG_STATUS = [['want', 'Want to learn'], ['learning', 'Learning'], ['solid', 'Got it'], ['perf', 'Performance ready']];

const INSTS = [['drums', 'Drums', '🥁'], ['guitar', 'Guitar', '🎸']];
const instOf = s => s.inst || 'drums';
function lfMusic() {
  const wk = weekDates();
  const inst = DB.ui.sub._inst || 'drums';
  const target = inst === 'guitar' ? DB.music.guitarTarget : DB.music.drumTarget;
  const mine = DB.drum.filter(s => instOf(s) === inst);
  const wkMins = sum(mine.filter(s => wk.includes(s.date)).map(s => s.mins));
  const totalMins = sum(mine.map(s => s.mins));
  const streak = streakOf(d => mine.some(s => s.date === d));
  const drumWk = sum(DB.drum.filter(s => wk.includes(s.date) && instOf(s) === 'drums').map(s => s.mins));
  const gtrWk  = sum(DB.drum.filter(s => wk.includes(s.date) && instOf(s) === 'guitar').map(s => s.mins));
  /* suggest the least-practiced area over the last 30 sessions */
  const recent = mine.slice(-30);
  const counts = Object.fromEntries(FOCUS_AREAS.map(f => [f[0], 0]));
  recent.forEach(s => { if (counts[s.focus] != null) counts[s.focus]++; });
  const pick = FOCUS_AREAS.reduce((m, f) => counts[f[0]] < counts[m[0]] ? f : m, FOCUS_AREAS[0]);
  const bpmSeries = mine.filter(s => s.bpm).map(s => ({ date: s.date, val: s.bpm }));

  const songs = SONG_STATUS.map(([id, lbl]) => ({ id, lbl, list: DB.songs.filter(s => s.status === id) }));
  const gigs = [...DB.gigs].sort((a, b) => (a.date || 'z').localeCompare(b.date || 'z'));

  return `
  <div class="grid g2 mb">
    ${INSTS.map(([id, lbl, ic]) => {
      const t = id === 'guitar' ? DB.music.guitarTarget : DB.music.drumTarget;
      const m = id === 'guitar' ? gtrWk : drumWk;
      return `<div class="tile" style="--_c:var(--music);${inst === id ? 'border-color:color-mix(in srgb,var(--music) 45%,transparent)' : ''}"
        onclick="DB.ui.sub._inst='${id}';save()">
        <span class="tile-i">${ic}</span>
        <div class="tile-v" style="color:${m >= t ? 'var(--music)' : 'var(--text)'}">${m}<small style="font-size:13px;color:var(--text-3)">/${t}</small></div>
        <div class="tile-l">${lbl} · min this wk</div>
        <div class="bar thin" style="--_c:var(--music);margin-top:8px"><span style="width:${pct(m, t)}%"></span></div>
      </div>`;
    }).join('')}
  </div>

  <div class="card accent mb" style="--_c:var(--music)">
    <div class="row" style="gap:16px;align-items:center">
      ${ring(pct(wkMins, target), { size: 76, sw: 7, color: 'var(--music)', val: wkMins, vs: 18, label: 'min/wk' })}
      <div class="grow">
        <div class="eyebrow">${esc(INSTS.find(i => i[0] === inst)[1])} streak</div>
        <div class="big sm">${streak}<small> days</small></div>
        <div class="li-s">${round(totalMins / 60, 1)} hours all time · target ${target} min/week</div>
      </div>
    </div>
    <button class="btn btn-accent btn-block mt" style="--_c:var(--music)" onclick="drumSheet()">+ Log practice</button>
  </div>

  <div class="card mb" style="--_c:var(--music)">
    <div class="eyebrow">Work on this next</div>
    <div class="focus-t" style="font-size:17px;margin:6px 0 4px">${esc(pick[1])}</div>
    <div class="sub">${esc(pick[2])}</div>
    <div class="li-s" style="margin-top:8px">Least-touched area in your last 30 sessions</div>
  </div>

  <div class="sect">${sectionHead('Minutes · this week')}
    <div class="card">${barChart(wk.map(k => ({
      label: DOW[new Date(k + 'T12:00:00').getDay()][0],
      val: sum(mine.filter(s => s.date === k).map(s => s.mins))
    })), { color: 'var(--music)', target: Math.round(target / 7), h: 104 })}
      <div class="li-s tc">Dashed line = ${Math.round(target / 7)} min/day to hit ${target}/week</div></div>
  </div>

  ${bpmSeries.length > 1 ? `<div class="sect">${sectionHead('Tempo ceiling')}
    <div class="card">${lineChart(bpmSeries, { color: 'var(--music)', h: 120, fmt: v => round(v) })}
      <div class="li-s tc mt-sm">Max clean BPM logged per session</div></div>
  </div>` : ''}

  <div class="sect">${sectionHead('Repertoire', ['+ Song', 'songSheet()'])}
    ${songs.map(({ id, lbl, list }) => list.length ? `
      <div class="card mb pad-sm">
        <div class="eyebrow mb">${esc(lbl)} · ${list.length}</div>
        ${list.map(s => `<div class="li" onclick="songSheet('${s.id}')" style="cursor:pointer;padding:9px 2px">
          <div class="li-main"><div class="li-t">${esc(s.t)}</div>
          <div class="li-s">${esc(s.artist || '')}${s.note ? ' · ' + esc(s.note) : ''}</div></div>
          <button class="x" onclick="event.stopPropagation();delSong('${s.id}')">✕</button></div>`).join('')}
      </div>` : '').join('')}
    ${DB.songs.length ? '' : `<div class="card"><div class="empty">Build the list you want to be able to play.<br>Then work backwards.</div></div>`}
  </div>

  <div class="sect">${sectionHead('Performances & projects', ['+ Add', 'gigSheet()'])}
    <div class="card">${gigs.length ? gigs.map(g => `
      <div class="li" onclick="gigSheet('${g.id}')" style="cursor:pointer">
        <span style="font-size:15px">🥁</span>
        <div class="li-main"><div class="li-t">${esc(g.t)}</div>
          <div class="li-s">${g.date ? fmtDW(g.date) : 'no date'}${g.note ? ' · ' + esc(g.note) : ''}</div></div>
        ${g.date ? `<span class="delta ${relDue(g.date).tone}">${relDue(g.date).txt}</span>` : ''}</div>`).join('')
      : `<div class="empty">Gigs, recordings, band projects — anything with a date and an audience.</div>`}</div>
  </div>

  <div class="sect">${sectionHead('Recent sessions')}
    <div class="card">${DB.drum.length ? [...DB.drum].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 10).map(s => `
      <div class="li"><span style="font-size:14px">${instOf(s) === 'guitar' ? '🎸' : '🥁'}</span>
        <div class="li-main"><div class="li-t">${esc(focusLabel(s.focus))}</div>
        <div class="li-s">${fmtDW(s.date)}${s.bpm ? ' · ' + s.bpm + ' bpm' : ''}${s.note ? ' · ' + esc(s.note) : ''}</div></div>
        <div class="num fs13" style="font-weight:650">${s.mins}<span class="muted fs11">m</span></div>
        <button class="x" onclick="delDrum('${s.id}')">✕</button></div>`).join('')
      : `<div class="empty">No sessions logged.</div>`}</div>
  </div>`;
}
function drumSheet() {
  formSheet('Log practice', [
    { k: 'inst', l: 'Instrument', type: 'select', opts: INSTS.map(i => [i[0], i[1]]), v: DB.ui.sub._inst || 'drums' },
    { k: 'mins', l: 'Minutes', type: 'number', v: 30 },
    { k: 'focus', l: 'Focus', type: 'select', opts: FOCUS_AREAS.map(f => [f[0], f[1]]), v: 'rudiments' },
    { k: 'bpm', l: 'Max clean BPM (optional)', type: 'number' },
    { k: 'date', l: 'Date', type: 'date', v: today() },
    { k: 'note', l: 'Notes', ph: "What clicked? What didn't?" },

function isoWeek(d) {
  const dt = new Date(d + 'T12:00:00');
  const day = (dt.getDay() + 6) % 7;
  dt.setDate(dt.getDate() - day + 3);
  const first = new Date(dt.getFullYear(), 0, 4);
  const wk = 1 + Math.round(((dt - first) / 864e5 - 3 + ((first.getDay() + 6) % 7)) / 7);
  return dt.getFullYear() + '-W' + String(wk).padStart(2, '0');
}

/* ═══════════════════════════════════════════════════════════════════
   CLOUD SYNC — end-to-end encrypted, any device
   ───────────────────────────────────────────────────────────────────
   This page is public. So the rule is: the server never sees plaintext.
   Everything is encrypted in the browser with a passphrase only Nick
   knows (PBKDF2 -> AES-GCM). Even with the anon key and the row id,
   an attacker gets a blob of ciphertext.

   NOTHING here is committed: url, key, sync id and passphrase all live
   in localStorage, entered on each device via Settings.
   ═══════════════════════════════════════════════════════════════════ */
const SYNC_KEY = 'nick_os_sync_cfg';           // deliberately NOT inside DB, so it never syncs
const SYNC_TABLE = 'nick_os_sync';

function syncCfg() {
  try { return JSON.parse(localStorage.getItem(SYNC_KEY)) || {}; } catch (e) { return {}; }
}
function setSyncCfg(c) { localStorage.setItem(SYNC_KEY, JSON.stringify(c)); }
const syncOn = () => { const c = syncCfg(); return !!(c.url && c.key && c.id && c.pass); };

/* ── crypto ───────────────────────────────────────────────────── */
const enc = new TextEncoder(), dec = new TextDecoder();
async function deriveKey(pass, salt) {
  const base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: enc.encode(salt), iterations: 250000, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function encryptBlob(obj, pass, salt) {
  const key = await deriveKey(pass, salt);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(JSON.stringify(obj)));
  return b64(iv) + '.' + b64(ct);
}
async function decryptBlob(str, pass, salt) {
  const [ivs, cts] = String(str).split('.');
  if (!ivs || !cts) throw new Error('bad payload');
  const key = await deriveKey(pass, salt);
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(ivs) }, key, unb64(cts));
  return JSON.parse(dec.decode(pt));
}

/* ── transport ────────────────────────────────────────────────── */
function sbHeaders(c) {
  return { apikey: c.key, Authorization: 'Bearer ' + c.key, 'Content-Type': 'application/json' };
}
let _syncState = { status: 'off', at: null, err: null };

async function syncPush(silent = true) {
  const c = syncCfg(); if (!syncOn()) return;
  try {
    _syncState.status = 'pushing'; paintSyncPill();
    /* photos are megabytes of base64 — opt-in only */
    const payload = c.photos ? DB : { ...DB, photos: [] };
    const blob = await encryptBlob(payload, c.pass, c.id);
    const r = await fetch(c.url.replace(/\/+$/, '') + '/rest/v1/' + SYNC_TABLE, {
      method: 'POST',
      headers: { ...sbHeaders(c), Prefer: 'resolution=merge-duplicates' },
      body: JSON.stringify({ id: c.id, blob, updated_at: new Date().toISOString() }),
    });
    if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + (await r.text().catch(() => '')).slice(0, 90));
    _syncState = { status: 'ok', at: Date.now(), err: null };
    if (!silent) toast('Synced up');
  } catch (e) {
    _syncState = { status: 'err', at: Date.now(), err: e.message };
    if (!silent) toast('Sync failed — ' + e.message);
  }
  paintSyncPill();
}

async function syncPull(silent = true) {
  const c = syncCfg(); if (!syncOn()) return false;
  try {
    _syncState.status = 'pulling'; paintSyncPill();
    const r = await fetch(c.url.replace(/\/+$/, '') + '/rest/v1/' + SYNC_TABLE +
      '?id=eq.' + encodeURIComponent(c.id) + '&select=blob,updated_at', { headers: sbHeaders(c) });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const rows = await r.json();
    if (!rows.length || !rows[0].blob) {
      _syncState = { status: 'ok', at: Date.now(), err: null };
      paintSyncPill();
      if (!silent) toast('Nothing saved yet — pushing this device up');
      await syncPush(true);
      return false;
    }
    let remote;
    try { remote = await decryptBlob(rows[0].blob, c.pass, c.id); }
    catch (e) { throw new Error('wrong passphrase for this sync ID'); }
    DB = deepMerge(DEFAULTS(), remote);
    localStorage.setItem(KEY, JSON.stringify(DB));
    _syncState = { status: 'ok', at: Date.now(), err: null };
    if (!silent) toast('Pulled from cloud');
    render();
    return true;
  } catch (e) {
    _syncState = { status: 'err', at: Date.now(), err: e.message };
    if (!silent) toast('Pull failed — ' + e.message);
    paintSyncPill();
    return false;
  }
}

/* debounced auto-push whenever anything changes */
let _pushT = null;
function syncQueue() {
  if (!syncOn()) return;
  clearTimeout(_pushT);
  _pushT = setTimeout(() => syncPush(true), 2500);
}

function paintSyncPill() {
  const el = $('syncPill'); if (!el) return;
  if (!syncOn()) { el.classList.add('hidden'); return; }
  el.classList.remove('hidden');
  const m = { ok: ['☁️', 'var(--fit)'], pushing: ['↑', 'var(--money)'], pulling: ['↓', 'var(--money)'],
              err: ['⚠', 'var(--danger)'], off: ['☁️', 'var(--text-3)'] }[_syncState.status] || ['☁️', 'var(--text-3)'];
  el.textContent = m[0];
  el.style.color = m[1];
  el.title = _syncState.err || 'Synced';
}

/* Pairing code carries endpoint + sync ID, never the passphrase.
   Device 2 pastes one string instead of retyping three fields. */
function makeSyncCode() {
  const c = syncCfg();
  if (!c.url || !c.key || !c.id) return '';
  return 'NOS1-' + btoa(JSON.stringify({ u: c.url, k: c.key, i: c.id })).replace(/=+$/, '');
}
function applySyncCode() {
  const raw = ($('syCode') ? $('syCode').value : '').trim();
  if (!raw.startsWith('NOS1-')) { toast('That is not a sync code'); return; }
  try {
    const o = JSON.parse(atob(raw.slice(5)));
    $('syUrl').value = o.u || ''; $('syKey').value = o.k || ''; $('syId').value = o.i || '';
    toast('Code accepted — now enter your passphrase');

  } catch (e) { toast('That code is damaged'); }
}

/* One tap: open the file picker straight away. No key, no config, no
   failing network call. Hevy's API refuses browser origins, so the

function hevyImportNow() {

async function hevyPull(fromSheet) {
  const k = hevyKey();
  if (!k) { hevySheet(); return; }
  const report = m => fromSheet ? hevySay(m, 'err') : toast(String(m).replace(/<[^>]+>/g, ''));
  try {
    const sessions = [];
    for (let page = 1; page <= 10; page++) {
      let r;
      try {
        r = await fetch(`https://api.hevyapp.com/v1/workouts?page=${page}&pageSize=10`,
          { headers: { 'api-key': k, accept: 'application/json' } });
      } catch (e) { report('<b>Blocked by the browser.</b> Use file import instead.'); return; }
      if (r.status === 401) { report('<b>401 — key rejected.</b>'); return; }
      if (r.status === 403) { report('<b>403 — the Hevy API requires Hevy Pro.</b>'); return; }
      if (!r.ok) { report('<b>HTTP ' + r.status + '</b> from Hevy.'); return; }
      const data = await r.json();
      const ws = data.workouts || [];
      ws.forEach(w => sessions.push(w));
      if (ws.length < 10) break;
    }
    const { added, prs } = ingestHevy(sessions.map(w => ({
      key: w.id, date: (w.start_time || w.created_at || '').slice(0, 10), title: w.title,
      dur: w.end_time && w.start_time ? Math.round((new Date(w.end_time) - new Date(w.start_time)) / 60000) : 0,
      ex: (w.exercises || []).map(e => ({
        name: e.title || 'Exercise',
        sets: (e.sets || []).filter(s => s.reps).map(s => ({ kg: Number(s.weight_kg) || 0, r: Number(s.reps) || 0 })),
      })),
    })));
    const msg = added ? `Imported ${added} workout${added === 1 ? '' : 's'}${prs ? ` · ${prs} PRs` : ''}` : 'Already up to date';
    if (fromSheet) hevySay('<b>' + msg + '</b>', 'ok'); else toast(msg);
  } catch (e) { report('Unexpected error: ' + esc(e.message)); }
}
/* shared ingest for both API and CSV — weights arrive in kg */
function ingestHevy(items) {
  const toLb = DB.profile.unit === 'lb';
  let added = 0, prs = 0;
  items.forEach(it => {
    if (!it.date || !it.key) return;
    if (DB.workouts.some(x => x.hv === it.key)) return;
    const ex = it.ex.map(e => ({
      name: e.name,
      sets: e.sets.map(s => ({ w: round(s.kg * (toLb ? KG_TO_LB : 1), 1), r: s.r })),
    })).filter(e => e.sets.length);
    if (!ex.length) return;
    const cyc = DB.split.cycle.findIndex(c => (it.title || '').toLowerCase().includes(c.toLowerCase()));
    DB.workouts.push({ id: uid(), hv: it.key, date: it.date, name: it.title || 'Workout',
                       dur: it.dur || 0, notes: '', ex, cyc: cyc >= 0 ? cyc : null });
    added++;
    ex.forEach(e => e.sets.forEach(s => {
      const best = DB.prs.filter(p => p.ex.toLowerCase() === e.name.toLowerCase())
        .reduce((m, p) => Math.max(m, e1rm(p.w, p.r)), 0);
      if (s.w > 0 && e1rm(s.w, s.r) > best) {
        DB.prs = DB.prs.filter(p => p.ex.toLowerCase() !== e.name.toLowerCase());
        DB.prs.push({ id: uid(), ex: e.name, w: s.w, r: s.r, date: it.date });
        prs++;
      }
    }));
  });
  if (added) { DB.workouts.sort((a, b) => a.date.localeCompare(b.date)); logScore(); save(); }
  return { added, prs };
}

/* ── CSV import — no API, no key, works for everyone ──────────── */
function parseCSV(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += ch;
    } else if (ch === '"') q = true;
    else if (ch === ',') { row.push(cell); cell = ''; }
    else if (ch === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (ch !== '\r') cell += ch;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.length > 1);
}
function hevyImportCSV(file) {
  const out = m => {
    const el = $('hvCsvOut');
    if (el) el.innerHTML = m;
    toast(String(m).replace(/<[^>]+>/g, '').trim());
  };
  out('Reading…');
  const rd = new FileReader();
  rd.onload = ev => {
    try {
      const rows = parseCSV(String(ev.target.result));
      if (rows.length < 2) { out('<span style="color:var(--danger)">That file looks empty.</span>'); return; }
      const head = rows[0].map(h => h.trim().toLowerCase().replace(/^"|"$/g, ''));
      const col = (...names) => { for (const n of names) { const i = head.indexOf(n); if (i >= 0) return i; } return -1; };
      const cTitle = col('title', 'workout_name'), cStart = col('start_time', 'date'),
            cEnd = col('end_time'), cEx = col('exercise_title', 'exercise_name', 'exercise'),
            cReps = col('reps'), cKg = col('weight_kg'), cLb = col('weight_lbs', 'weight_lb');
      if (cEx < 0 || cReps < 0 || cStart < 0) {
        out('<span style="color:var(--danger)">Unrecognised columns. Expected a Hevy workout export with ' +
            'start_time, exercise_title and reps.<br>Found: ' + esc(head.slice(0, 8).join(', ')) + '</span>');
        return;
      }
      const byWorkout = {};
      for (let i = 1; i < rows.length; i++) {
        const r = rows[i]; if (!r[cStart]) continue;
        const startRaw = r[cStart].trim();
        const date = parseHevyDate(startRaw);
        if (!date) continue;
        const key = 'csv:' + startRaw;
        const wo = byWorkout[key] || (byWorkout[key] = {
          key, date, title: cTitle >= 0 ? r[cTitle] : 'Workout', dur: 0, ex: [], _end: cEnd >= 0 ? r[cEnd] : null,
        });
        const reps = Number(r[cReps]); if (!reps) continue;
        const kg = cKg >= 0 && r[cKg] !== '' ? Number(r[cKg])
                 : cLb >= 0 && r[cLb] !== '' ? Number(r[cLb]) / KG_TO_LB : 0;
        const name = (r[cEx] || 'Exercise').trim();
        let e = wo.ex.find(x => x.name === name);
        if (!e) { e = { name, sets: [] }; wo.ex.push(e); }
        e.sets.push({ kg: isNaN(kg) ? 0 : kg, r: reps });
      }
      const list = Object.values(byWorkout);
      list.forEach(w => {
        if (w._end) { const a = new Date(w.key.slice(4)), b = new Date(w._end);
          if (!isNaN(a) && !isNaN(b)) w.dur = Math.max(0, Math.round((b - a) / 60000)); }
      });
      const { added, prs } = ingestHevy(list);
      if (added) localStorage.setItem('nick_os_hevy_at', today());
      out(added
        ? `<span style="color:var(--fit)"><b>Imported ${added} workout${added === 1 ? '' : 's'}</b>` +
          `${prs ? ` · ${prs} PRs detected` : ''} from ${list.length} found in the file.</span>`
        : `<span style="color:var(--warning)">Found ${list.length} workouts — all of them were already imported.</span>`);
    } catch (e) {
      out('<span style="color:var(--danger)">Could not read that file: ' + esc(e.message) + '</span>');
    }
  };
  rd.onerror = () => out('<span style="color:var(--danger)">Could not open the file.</span>');
  rd.readAsText(file);
}
/* Hevy exports have used several date formats over the years */
function parseHevyDate(s) {
  if (!s) return null;
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);                       // 2026-08-03…
  if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^(\d{1,2})\s+([A-Za-z]{3})\s+(\d{4})/);               // 3 Aug 2026
  if (m) { const mo = MON.findIndex(x => x.toLowerCase() === m[2].toLowerCase());
    if (mo >= 0) return `${m[3]}-${String(mo + 1).padStart(2, '0')}-${m[1].padStart(2, '0')}`; }
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);                     // 08/03/2026 (US)
  if (m) return `${m[3]}-${m[1].padStart(2, '0')}-${m[2].padStart(2, '0')}`;
  const d = new Date(s);
  return isNaN(d) ? null : ymd(d);
}

      has: d => DB.drum.some(x => x.date === d && (x.inst || 'drums') === 'drums') },
    { label: 'Guitar', icon: '🎸', color: 'var(--music)',
      s: streakOf(d => DB.drum.some(x => x.date === d && x.inst === 'guitar')),
      has: d => DB.drum.some(x => x.date === d && x.inst === 'guitar') },
    { label: 'Journal', icon: '📓', color: 'var(--growth)', s: streakOf(d => DB.journal.some(j => j.date === d)),
      has: d => DB.journal.some(j => j.date === d) },
    { label: 'Cold calls', icon: '☎️', color: 'var(--biz)', s: streakOf(d => ((DB.calls[d] || {}).dials || 0) >= 20),
      has: d => ((DB.calls[d] || {}).dials || 0) >= 20 },
  ];
  const days = lastN(70);

  return `
  <div class="grid g2 mb stagger">
    ${items.slice(0, 4).map(i => `
      <div class="tile" style="--_c:${i.color}">
        <span class="tile-i">${i.icon}</span>
        <div class="tile-v" style="color:${i.s > 0 ? i.color : 'var(--text-3)'}">${i.s}</div>
        <div class="tile-l">${esc(i.label)}</div>
      </div>`).join('')}
  </div>

  ${items.map(i => `
    <div class="sect">${sectionHead(i.icon + ' ' + i.label + ' · ' + i.s + ' day' + (i.s === 1 ? '' : 's'))}
      <div class="card">
        ${heatgrid(days, d => i.has(d) ? 4 : 0, i.color)}
        <div class="li-s tc mt-sm">Last 10 weeks</div>
      </div>
    </div>`).join('')}

  ${DB.habits.length ? `<div class="sect">${sectionHead('Habit streaks')}
    <div class="card">${DB.habits.map(h => {
      const st = streakOf(k => !!(h.log && h.log[k]));
      const last30 = lastN(30).filter(k => h.log && h.log[k]).length;
      return `<div class="li"><span style="font-size:15px">${esc(h.icon || '●')}</span>
        <div class="li-main"><div class="li-t">${esc(h.name)}</div>
          <div class="li-s">${last30}/30 days · ${round(last30 / 30 * 100)}% consistency</div></div>
        <div class="num fs14" style="font-weight:700;color:${st ? domColor(h.dom) : 'var(--text-3)'}">🔥 ${st}</div></div>`;
    }).join('')}</div>
  </div>` : ''}`;
}

/* ── TRENDS ───────────────────────────────────────────────────── */
function stTrends() {
  const wk = weekDates();
  const charts = [
    { t: 'Life score', c: scoreTone(scores().total), data: scoreHistory(30) },
    { t: 'Bodyweight', c: 'var(--fit)', data: DB.weights.filter(w => daysBetween(w.date, today()) <= 90).map(w => ({ date: w.date, val: w.w })) },
    { t: 'Net worth', c: 'var(--money)', data: [...DB.nwLog].sort((a, b) => a.date.localeCompare(b.date)).map(l => ({ date: l.date, val: l.val })) },
  ].filter(c => c.data.length > 1);

  const weekly = [];
  for (let i = 7; i >= 0; i--) {
    const end = addDays(today(), -i * 7), w = weekDates(end);
    weekly.push({
      label: i === 0 ? 'now' : '-' + i,
      workouts: new Set(DB.workouts.filter(x => w.includes(x.date)).map(x => x.date)).size,
      drum: sum(DB.drum.filter(x => w.includes(x.date)).map(x => x.mins)),
      dials: sum(w.map(k => (DB.calls[k] || {}).dials || 0)),
      spend: sum(DB.tx.filter(t => t.type === 'out' && w.includes(t.date)).map(t => t.amt)),
    });
  }

  return `
  ${charts.map(c => `<div class="sect">${sectionHead(c.t)}
    <div class="card">${lineChart(c.data, { color: c.c, h: 130, fmt: v => round(v, 1) })}</div></div>`).join('')}

  <div class="sect">${sectionHead('Workouts per week')}
    <div class="card">${barChart(weekly.map(w => ({ label: w.label, val: w.workouts })), { color: 'var(--fit)', target: 4, h: 100 })}</div>
  </div>

  <div class="sect">${sectionHead('Drum minutes per week')}
    <div class="card">${barChart(weekly.map(w => ({ label: w.label, val: w.drum })), { color: 'var(--music)', target: 150, h: 100 })}</div>
  </div>

  <div class="sect">${sectionHead('Dials per week')}
    <div class="card">${barChart(weekly.map(w => ({ label: w.label, val: w.dials })), { color: 'var(--biz)', target: 100, h: 100 })}</div>
  </div>

  <div class="sect">${sectionHead('Spending per week')}
    <div class="card">${barChart(weekly.map(w => ({ label: w.label, val: w.spend })), { color: 'var(--danger)', h: 100 })}</div>
  </div>

  <div class="sect">${sectionHead('Correlation watch')}
    <div class="card"><div class="sub" style="line-height:1.7">${esc(correlationNote(weekly))}</div></div>
  </div>`;
}
function correlationNote(weekly) {
  const w = weekly.filter(x => x.workouts || x.drum || x.dials);
  if (w.length < 4) return 'Keep logging — after a month of data this will start calling out the patterns between your training, your practice and your output.';
  const trained = w.filter(x => x.workouts >= 4), didnt = w.filter(x => x.workouts < 4);
  if (trained.length && didnt.length) {
    const a = avg(trained.map(x => x.dials)), b = avg(didnt.map(x => x.dials));
    if (a > b * 1.25) return `Weeks you trained 4+ times, you averaged ${round(a)} dials versus ${round(b)} on the weeks you didn't. The gym isn't competing with the business — it's fuelling it.`;
    if (b > a * 1.25) return `Interesting: your dial count is higher on weeks you trained less. Worth asking whether the schedule needs rebalancing, or whether you're just trading one for the other.`;
  }
  return 'No strong pattern yet across training, practice and output. Keep the logs honest and check back next month.';
}

/* ── REPORT ───────────────────────────────────────────────────── */
function stReport() {
  const mk = monthKey(), mName = MON[new Date().getMonth()] + ' ' + new Date().getFullYear();
  const ws = DB.workouts.filter(w => w.date.startsWith(mk));
  const mDays = Object.keys(DB.nutrition).filter(k => k.startsWith(mk));
  const rev = sum(DB.revenue.filter(r => r.date.startsWith(mk)).map(r => r.amt));
  const spent = monthOut(mk), earned = monthIn(mk);
  const drumMins = sum(DB.drum.filter(s => s.date.startsWith(mk)).map(s => s.mins));
  const dials = sum(Object.keys(DB.calls).filter(k => k.startsWith(mk)).map(k => DB.calls[k].dials || 0));
  const assignDone = DB.assign.filter(a => a.done).length;
  const jEntries = DB.journal.filter(j => j.date.startsWith(mk)).length;
  const scoreDays = Object.keys(DB.scoreLog).filter(k => k.startsWith(mk));
  const avgScore = scoreDays.length ? round(avg(scoreDays.map(k => DB.scoreLog[k].total))) : scores().total;

  const block = (title, color, rows) => `
    <div class="sect">${sectionHead(title)}
      <div class="card" style="--_c:${color}">${rows.map(([k, v]) =>
        `<div class="kv"><span class="kv-k">${esc(k)}</span><span class="kv-v">${esc(String(v))}</span></div>`).join('')}</div>
    </div>`;

  return `
  <div class="card accent mb" style="--_c:var(--stats)">
    <div class="eyebrow">${esc(mName)}</div>
    <div class="focus-t" style="font-size:20px;margin-top:6px">Average life score ${avgScore}</div>
    <div class="li-s">${scoreDays.length} day${scoreDays.length === 1 ? '' : 's'} tracked this month</div>
  </div>

  ${block('Body', 'var(--fit)', [
    ['Sessions', new Set(ws.map(w => w.date)).size],
    ['Total volume', round(sum(ws.map(volOf))).toLocaleString() + ' ' + DB.profile.unit],
    ['Calorie target hit', mDays.filter(k => nutTotals(k).kcal >= DB.nutTarget.kcal * .95).length + ' days'],
    ['Protein target hit', mDays.filter(k => nutTotals(k).p >= DB.nutTarget.p).length + ' days'],
    ['Gallon of water hit', mDays.filter(k => nutDay(k).water >= DB.nutTarget.water).length + ' days'],
    ['New PRs', DB.prs.filter(p => p.date.startsWith(mk)).length],
    ['Weight change', (() => {
      const m = DB.weights.filter(w => w.date.startsWith(mk));
      return m.length > 1 ? (m[m.length - 1].w - m[0].w > 0 ? '+' : '') + round(m[m.length - 1].w - m[0].w, 1) + ' ' + DB.profile.unit : '—';
    })()],
  ])}

  ${block('Work', 'var(--biz)', [
    ['Revenue', money(rev)],
    ['of which recurring (MRR)', money(mrr())],
    ['Dials', dials],
    ['Leads added', DB.leads.filter(l => (l.ts || '').startsWith(mk)).length],
    ['Deals won', DB.leads.filter(l => l.stage === 'won').length],
    ['Active projects', DB.projects.filter(p => p.status === 'active').length],
    ['Ideas captured', DB.ideas.filter(i => (i.ts || '').startsWith(mk)).length],
  ])}

  ${block('Money', 'var(--money)', [
    ['In', money(earned)], ['Out', money(spent)],
    ['Net', money(earned - spent)],
    ['Savings rate', (earned > 0 ? round((earned - spent) / earned * 100) : 0) + '%'],
    ['Net worth', money(netWorth())],
    ['Recurring', money(sum(DB.subs.map(s => s.cycle === 'year' ? s.amt / 12 : s.cycle === 'week' ? s.amt * 4.33 : s.amt)), 2) + '/mo'],
  ])}

  ${block('School & Music', 'var(--school)', [
    ['Assignments completed', assignDone],
    ['Still open', DB.assign.filter(a => !a.done).length],
    ['Upcoming exams', DB.exams.filter(e => e.date >= today()).length],
    ['Drum minutes', sum(DB.drum.filter(x => x.date.startsWith(mk) && (x.inst || 'drums') === 'drums').map(x => x.mins))],
    ['Guitar minutes', sum(DB.drum.filter(x => x.date.startsWith(mk) && x.inst === 'guitar').map(x => x.mins))],
    ['Schools on list', DB.schools.length],
    ['Songs learning', DB.songs.filter(s => s.status === 'learning').length],
  ])}

  ${block('Growth', 'var(--growth)', [
    ['Journal entries', jEntries],
    ['Reviews done', DB.reviews.filter(r => r.period.includes(mk.slice(0, 4))).length],
    ['Books finished', DB.books.filter(b => b.done).length],
    ['Habits tracked', DB.habits.length],
    ['Best streak', Math.max(0, ...DB.habits.map(h => streakOf(k => !!(h.log && h.log[k]))))],
  ])}

  <button class="btn btn-block mb" onclick="copyReport()">Copy report as text</button>`;
}
function copyReport() {
  const mk = monthKey(), s = scores();
  const lines = [
    `NICK OS — ${MON[new Date().getMonth()]} ${new Date().getFullYear()} report`, '',
    `Life score today: ${s.total}`,
    ...DOMAINS.map(d => `  ${d.label}: ${s[d.id]}`), '',
    `Workouts this month: ${new Set(DB.workouts.filter(w => w.date.startsWith(mk)).map(w => w.date)).size}`,
    `Revenue: ${money(sum(DB.revenue.filter(r => r.date.startsWith(mk)).map(r => r.amt)))}`,
    `Net worth: ${money(netWorth())}`,
    `Drum minutes: ${sum(DB.drum.filter(x => x.date.startsWith(mk)).map(x => x.mins))}`,
    `Assignments open: ${DB.assign.filter(a => !a.done).length}`,
    `Journal entries: ${DB.journal.filter(j => j.date.startsWith(mk)).length}`,
  ].join('\n');
  navigator.clipboard.writeText(lines).then(() => toast('Report copied')).catch(() => toast('Copy failed'));
}

   </div>
   <div class="row mb" style="gap:8px">
     <button class="btn grow" onclick="closeSheet();syncSheet()">☁️ Cloud sync</button>
     <button class="btn grow" onclick="closeSheet();hevySheet()">Hevy</button>
   </div>
   <button class="btn btn-block mb" style="color:#FF6B6B" onclick="closeSheet();resetAll()">Erase everything</button>`);
}
function exportData() {
  const blob = new Blob([JSON.stringify(DB, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'nick-os-' + today() + '.json';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast('Backup downloaded');
}
function importData() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'application/json';
  inp.onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = ev => {
      try {
        DB = deepMerge(DEFAULTS(), JSON.parse(ev.target.result));
        save(); toast('Imported');
      } catch (err) { toast('That file was not valid'); }
    };
    r.readAsText(f);
  };
  inp.click();
}
function resetAll() {
  askConfirm('This erases every entry in Nick OS on this device. Export a backup first if you want it back. Your old dashboards are not affected.',
    () => { localStorage.removeItem(KEY); DB = DEFAULTS(); save(); toast('Wiped clean'); });
}

/* ── modal plumbing ──────────────────────────────────────────── */
$('modalBg').addEventListener('click', e => { if (e.target === $('modalBg')) closeSheet(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

/* ── boot ─────────────────────────────────────────────────────── */
(function boot() {
  load();
  seedIfEmpty();
  logScore();
  if (!RENDERERS[DB.ui.tab]) DB.ui.tab = 'home';
  save(false);
  render();
  if (DB._imported) {
    setTimeout(() => toast('Imported ' + DB._imported + ' records from your old dashboards'), 700);
    delete DB._imported; save(false);
  }
  /* re-score at midnight-ish so the day rolls over while the tab is open */
  setInterval(() => { const t = today(); if (t !== boot._d) { boot._d = t; logScore(); render(); } }, 60000);
  boot._d = today();
  /* if this device is linked, the cloud is the source of truth on open */
  if (syncOn()) syncPull(true);
})();
