<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#08080A">
<title>Nick</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --text:#F5F5F7; --text-2:#A9A8AE; --text-3:#6E6D75; --text-4:#48484F;
  --bg:#08080A;
  --card:rgba(255,255,255,0.042);
  --card-2:rgba(255,255,255,0.022);
  --line:rgba(255,255,255,0.075);
  --line-soft:rgba(255,255,255,0.045);
  --food:#F2A65A;   /* calories */
  --water:#5AC8FA;  /* water    */
  --lift:#5CE1A6;   /* training */
  --drum:#FF7A9C;   /* drums    */
  --gtr:#B78BFF;    /* guitar   */
  --warn:#F2C063; --bad:#FF6B6B;
  --r:20px; --ease:cubic-bezier(.22,1,.36,1);
}
html{height:100%;-webkit-text-size-adjust:100%;}
body{min-height:100%;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;
  line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  overflow-x:hidden;position:relative;}
body::before{content:'';position:fixed;inset:-10%;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 55% 32% at 80% 4%,rgba(242,166,90,.13),transparent 68%),
             radial-gradient(ellipse 45% 35% at 12% 92%,rgba(92,225,166,.07),transparent 70%);
  filter:blur(55px);}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important;}}

.app{position:relative;z-index:1;max-width:560px;margin:0 auto;
  padding:0 16px calc(96px + env(safe-area-inset-bottom));}

/* header */
.top{position:sticky;top:0;z-index:30;margin:0 -16px 16px;
  padding:max(14px,env(safe-area-inset-top)) 16px 12px;
  background:rgba(8,8,10,.75);backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid var(--line-soft);
  display:flex;align-items:center;gap:12px;}
.top h1{font-size:19px;font-weight:700;letter-spacing:-.02em;flex:1;min-width:0;}
.top .sub{font-size:11.5px;color:var(--text-3);font-weight:400;letter-spacing:0;}
.gear{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  color:var(--text-2);font-size:16px;cursor:pointer;flex:0 0 auto;}
.gear:active{transform:scale(.94);}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;
  margin-bottom:12px;position:relative;overflow:hidden;}
.card.hi::before{content:'';position:absolute;top:0;right:0;width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--_c) 16%,transparent),transparent 70%);
  transform:translate(35%,-45%);pointer-events:none;}
.lbl{font-size:10px;font-weight:750;letter-spacing:.16em;text-transform:uppercase;color:var(--text-3);}
.big{font-family:var(--mono);font-weight:700;letter-spacing:-.035em;font-variant-numeric:tabular-nums;line-height:1;}
.big.xl{font-size:44px;} .big.lg{font-size:32px;} .big.md{font-size:24px;}
.big small{font-size:15px;color:var(--text-3);font-weight:600;letter-spacing:0;}
.sub2{font-size:12.5px;color:var(--text-2);}
.muted{color:var(--text-3);}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;}

/* bar */
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;}
.bar>span{display:block;height:100%;border-radius:99px;background:var(--_c,var(--lift));
  box-shadow:0 0 12px color-mix(in srgb,var(--_c,var(--lift)) 55%,transparent);
  transition:width .6s var(--ease);}
.bar.sm{height:5px;}

/* buttons */
.btn{font-family:var(--font);font-size:14px;font-weight:620;padding:12px 16px;border-radius:14px;
  cursor:pointer;border:1px solid var(--line);background:rgba(255,255,255,.055);color:var(--text);
  transition:transform .14s,background .14s;}
.btn:active{transform:scale(.96);}
.btn.primary{background:#F5F5F7;color:#08080A;border-color:transparent;font-weight:700;}
.btn.on{background:color-mix(in srgb,var(--_c) 20%,transparent);
  border-color:color-mix(in srgb,var(--_c) 45%,transparent);color:var(--_c);}
.btn.block{width:100%;}
.btn.sm{font-size:12.5px;padding:9px 13px;border-radius:11px;}
.row{display:flex;gap:8px;} .row>.grow{flex:1;min-width:0;}
.mt{margin-top:12px;} .mt2{margin-top:18px;}

/* slot grid — the 5-6 feeds a day */
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;}
.slot{background:var(--card-2);border:1px solid var(--line);border-radius:14px;padding:11px 8px;
  text-align:center;cursor:pointer;transition:.16s;}
.slot:active{transform:scale(.95);}
.slot.done{background:color-mix(in srgb,var(--food) 15%,transparent);
  border-color:color-mix(in srgb,var(--food) 40%,transparent);}
.slot .n{font-size:10.5px;font-weight:700;letter-spacing:.05em;color:var(--text-3);text-transform:uppercase;}
.slot.done .n{color:var(--food);}
.slot .v{font-family:var(--mono);font-size:15px;font-weight:700;margin-top:4px;
  font-variant-numeric:tabular-nums;color:var(--text-4);}
.slot.done .v{color:var(--text);}

/* today rows */
.trow{display:flex;align-items:center;gap:13px;padding:14px 2px;border-bottom:1px solid var(--line-soft);}
.trow:last-child{border-bottom:none;}
.trow .ico{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  font-size:16px;flex:0 0 auto;background:color-mix(in srgb,var(--_c) 14%,transparent);}
.trow .t{flex:1;min-width:0;}
.trow .t b{font-size:15px;font-weight:600;display:block;}
.trow .t span{font-size:12px;color:var(--text-3);}
.tick{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);background:var(--card-2);
  cursor:pointer;flex:0 0 auto;display:flex;align-items:center;justify-content:center;transition:.2s;padding:0;}
.tick:active{transform:scale(.88);}
.tick.on{background:var(--_c);border-color:var(--_c);}
.tick.on::after{content:'';width:7px;height:12px;border:solid #08080A;border-width:0 2.6px 2.6px 0;
  transform:rotate(45deg) translate(-1px,-1px);}

/* week */
.wk{display:flex;gap:5px;margin-top:12px;}
.wk i{flex:1;height:34px;border-radius:8px;background:rgba(255,255,255,.05);display:flex;
  align-items:flex-end;justify-content:center;padding-bottom:4px;font-size:9px;font-weight:700;
  color:var(--text-4);font-style:normal;}
.wk i.on{background:color-mix(in srgb,var(--_c) 55%,transparent);color:#08080A;}
.wk i.today{outline:1.5px solid rgba(255,255,255,.25);outline-offset:-1px;}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;
  padding:8px 12px calc(8px + env(safe-area-inset-bottom));
  background:rgba(8,8,10,.82);backdrop-filter:blur(22px) saturate(180%);
  -webkit-backdrop-filter:blur(22px) saturate(180%);border-top:1px solid var(--line-soft);}
.nav div{display:flex;gap:6px;width:100%;max-width:560px;}
.nav button{flex:1;padding:11px;border-radius:14px;border:1px solid transparent;background:none;
  color:var(--text-4);font-family:var(--font);font-size:12.5px;font-weight:700;letter-spacing:.02em;
  cursor:pointer;transition:.18s;}
.nav button.active{color:#fff;background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.09);}

/* sheet */
.mbg{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;justify-content:center;
  background:rgba(0,0,0,.62);backdrop-filter:blur(8px);}
.mbg.show{display:flex;}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow-y:auto;background:#101014;
  border:1px solid rgba(255,255,255,.09);border-radius:26px 26px 0 0;
  padding:10px 20px calc(24px + env(safe-area-inset-bottom));animation:up .3s var(--ease);}
@keyframes up{from{transform:translateY(100%);}to{transform:none;}}
.sheet::-webkit-scrollbar{display:none;}
.grip{width:36px;height:4px;border-radius:99px;background:rgba(255,255,255,.18);margin:0 auto 16px;}
.sh{font-size:20px;font-weight:700;letter-spacing:-.02em;margin-bottom:16px;}
@media(min-width:601px){.mbg{align-items:center;}.sheet{border-radius:24px;max-width:440px;}}

input,select{background:var(--card-2);border:1px solid var(--line);border-radius:13px;color:var(--text);
  font-family:var(--font);font-size:16px;padding:13px;outline:none;width:100%;}
input:focus{border-color:rgba(255,255,255,.24);}
input[type=date]{color-scheme:dark;}
.fl{font-size:10px;font-weight:750;letter-spacing:.14em;text-transform:uppercase;color:var(--text-3);
  margin-bottom:7px;display:block;}
.f{margin-bottom:14px;}
.pick{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px;}
.pick button{padding:9px 13px;border-radius:11px;border:1px solid var(--line);background:var(--card-2);
  color:var(--text-2);font-family:var(--font);font-size:13px;font-weight:600;cursor:pointer;}
.pick button:active{transform:scale(.95);}

.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));z-index:80;
  transform:translateX(-50%) translateY(16px);opacity:0;pointer-events:none;
  background:rgba(30,30,34,.97);border:1px solid rgba(255,255,255,.1);border-radius:99px;
  padding:11px 20px;font-size:13.5px;font-weight:600;transition:.26s var(--ease);
  max-width:calc(100vw - 32px);text-align:center;}
.toast.show{opacity:1;transform:translateX(-50%);}

.empty{color:var(--text-4);font-size:13.5px;text-align:center;padding:20px 6px;line-height:1.6;}
.hidden{display:none!important;}
.kv{display:flex;justify-content:space-between;align-items:baseline;padding:11px 0;
  border-bottom:1px solid var(--line-soft);font-size:14px;}
.kv:last-child{border-bottom:none;}
.kv b{font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums;}
.panel{animation:fade .3s var(--ease);}
@keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
svg.chart{width:100%;display:block;overflow:visible;}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div style="flex:1;min-width:0">
      <h1 id="hTitle">Today</h1>
      <div class="sub" id="hSub">—</div>
    </div>
    <button class="gear" onclick="setup()">⚙</button>
  </div>
  <div id="main"></div>
</div>
<nav class="nav"><div>
  <button id="nToday" onclick="go('today')">Today</button>
  <button id="nWeek" onclick="go('week')">Week</button>
</div></nav>
<div class="mbg" id="mbg"><div class="sheet"><div class="grip"></div><div id="sheet"></div></div></div>
<div class="toast" id="toast"></div>
<script>
/* ═══════════════════════════════════════════════════════════════════
   NICK — built around one actual routine:
   Hevy for lifting · drums 6x · guitar 3x · a gallon of water ·
   2,900 kcal across 3 meals and 3 shakes.
   Two screens. Nothing else.
   ═══════════════════════════════════════════════════════════════════ */
const BUILD = '2026.08.05-21';
const $ = i => document.getElementById(i);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clamp = (n,a,b) => Math.max(a,Math.min(b,n));
const sum = a => a.reduce((x,y)=>x+(Number(y)||0),0);
const round = (n,d=0) => { const m=10**d; return Math.round((Number(n)||0)*m)/m; };
const avg = a => a.length ? sum(a)/a.length : 0;
const pct = (a,b) => b>0 ? clamp(a/b*100,0,100) : 0;
const KG_TO_LB = 2.20462;

const ymd = d => { const x=new Date(d); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); };
function today(){ const d=new Date(); if(d.getHours()<4) d.setDate(d.getDate()-1); return ymd(d); }
const addDays = (k,n) => { const d=new Date(k+'T12:00:00'); d.setDate(d.getDate()+n); return ymd(d); };
const daysBetween = (a,b) => Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
const DOW=['S','M','T','W','T','F','S'], DOWL=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtD = k => { const d=new Date(k+'T12:00:00'); return MON[d.getMonth()]+' '+d.getDate(); };
/* Monday-start week containing `end` */
function thisWeek(end=today()){
  const d=new Date(end+'T12:00:00'); const off=(d.getDay()+6)%7;
  const mon=addDays(end,-off); return Array.from({length:7},(_,i)=>addDays(mon,i));
}
const lastN = n => Array.from({length:n},(_,i)=>addDays(today(),-(n-1-i)));

/* ── store ─────────────────────────────────────────────────────── */
const KEY='nick_v2';
const SLOTS=[['m1','Meal 1'],['m2','Meal 2'],['m3','Meal 3'],['s1','Shake 1'],['s2','Shake 2'],['s3','Shake 3']];
const DEF = () => ({
  v:2,
  t:{ kcal:2900, protein:130, waterOz:128, bottle:22, lift:6, drums:6, guitar:3, unit:'lb' },
  day:{},        // date -> {meals:{m1:{kcal,p,name}}, water:oz, drums:1, guitar:1, weight}
  foods:[],      // saved quick-picks
  workouts:[],   // Hevy
  health:{},     // date -> {steps,rhr,sleep}
});
let DB=DEF(), _t=null;

function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){ DB=merge(DEF(),JSON.parse(raw)); return; }
  }catch(e){}
  DB=DEF(); migrate(); writeNow();
}
function merge(b,o){
  if(o==null) return b;
  if(Array.isArray(b)) return Array.isArray(o)?o:b;
  if(typeof b!=='object'||typeof o!=='object') return typeof o===typeof b?o:b;
  const out={...b}; for(const k in o) out[k]=(k in b)?merge(b[k],o[k]):o[k]; return out;
}
/* carry across whatever the old dashboard had, so nothing is lost */
function migrate(){
  try{
    const old=JSON.parse(localStorage.getItem('nick_os_v1')||'null'); if(!old) return;
    (old.workouts||[]).forEach(w=>DB.workouts.push(w));
    (old.weights||[]).forEach(x=>{ const d=DB.day[x.date]||(DB.day[x.date]={}); d.weight=x.w; });
    for(const dt in (old.nutrition||{})){
      const n=old.nutrition[dt]; const d=DB.day[dt]||(DB.day[dt]={});
      const ent=n.entries||[];
      if(ent.length){ d.meals={}; ent.slice(0,6).forEach((e,i)=>{
        d.meals[SLOTS[i][0]]={kcal:round(e.kcal),p:round(e.p||0,1),name:e.name||'Logged'}; }); }
      if(n.water) d.water=round(n.water*8);        // old app counted cups
    }
    (old.drum||[]).forEach(s=>{ const d=DB.day[s.date]||(DB.day[s.date]={});
      if((s.inst||'drums')==='guitar') d.guitar=1; else d.drums=1; });
    for(const dt in (old.health||{})) DB.health[dt]=old.health[dt];
    if(old.nutTarget&&old.nutTarget.kcal) DB.t.kcal=old.nutTarget.kcal;
    if(old.profile&&old.profile.unit) DB.t.unit=old.profile.unit;
    (old.foods||[]).slice(0,40).forEach(f=>DB.foods.push({id:uid(),name:f.name,kcal:round(f.kcal),p:round(f.p||0,1)}));
  }catch(e){}
}
function writeNow(){ clearTimeout(_t); try{ localStorage.setItem(KEY,JSON.stringify(DB)); return true; }catch(e){ return false; } }
addEventListener('pagehide',writeNow);
addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') writeNow(); });
function save(re=true){ clearTimeout(_t); _t=setTimeout(()=>{ if(!writeNow()) toast('Storage full'); },120); if(re) render(); }

const day = (d=today()) => DB.day[d] || {};
function setDay(k,v,d=today()){
  const rec={...day(d)};
  if(v===''||v==null||v===false) delete rec[k]; else rec[k]=v;
  DB.day[d]=rec; save();
}
const kcalOf = (d=today()) => sum(Object.values((day(d).meals)||{}).map(m=>m.kcal));
const protOf = (d=today()) => sum(Object.values((day(d).meals)||{}).map(m=>m.p));
const liftedOn = d => DB.workouts.some(w=>w.date===d);

/* ── ui bits ───────────────────────────────────────────────────── */
let _tt=null;
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(_tt); _tt=setTimeout(()=>t.classList.remove('show'),1900); }
function haptic(){ if(navigator.vibrate) try{navigator.vibrate(8);}catch(e){} }
function sheet(title,html,after){ $('sheet').innerHTML=`<div class="sh">${esc(title)}</div>${html}`;
  $('mbg').classList.add('show'); document.body.style.overflow='hidden'; if(after) after(); }
function close(){ $('mbg').classList.remove('show'); document.body.style.overflow=''; }
$('mbg').addEventListener('click',e=>{ if(e.target===$('mbg')) close(); });
addEventListener('keydown',e=>{ if(e.key==='Escape') close(); });

function ring(p,val,label,color,size=118,sw=11){
  const r=(size-sw)/2, c=2*Math.PI*r, off=c-clamp(p,0,100)/100*c;
  return `<div style="position:relative;display:inline-flex;width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" style="transform:rotate(-90deg)">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="rgba(255,255,255,.07)" stroke-width="${sw}" fill="none"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="${color}" stroke-width="${sw}" fill="none"
        stroke-linecap="round" stroke-dasharray="${round(c,2)}" stroke-dashoffset="${round(off,2)}"
        style="transition:stroke-dashoffset .7s var(--ease)"/></svg>
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center">
      <div class="big md">${val}</div>
      <div class="lbl" style="margin-top:3px">${esc(label)}</div></div></div>`;
}
function line(pts,color,h=110){
  const v=pts.filter(p=>p.val!=null);
  if(v.length<2) return `<div class="empty">Not enough data yet</div>`;
  const w=320,pl=32,pr=8,pt=10,pb=18,iw=w-pl-pr,ih=h-pt-pb;
  const vals=v.map(p=>p.val); let mn=Math.min(...vals),mx=Math.max(...vals);
  const pad=(mx-mn)*.2||1; mn-=pad; mx+=pad; const rg=mx-mn||1;
  const X=i=>pl+i/(v.length-1)*iw, Y=x=>pt+ih-(x-mn)/rg*ih;
  const d=v.map((p,i)=>(i?'L':'M')+round(X(i),1)+' '+round(Y(p.val),1)).join(' ');
  const g='g'+uid();
  return `<svg class="chart" viewBox="0 0 ${w} ${h}">
    <defs><linearGradient id="${g}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity=".28"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    ${[0,.5,1].map(f=>`<line x1="${pl}" y1="${round(pt+ih*f,1)}" x2="${w-pr}" y2="${round(pt+ih*f,1)}"
      stroke="rgba(255,255,255,.05)"/><text x="0" y="${round(pt+ih*f+3,1)}" fill="#48484F"
      style="font:9px var(--mono)">${round(mx-rg*f,1)}</text>`).join('')}
    <path d="${d} L${round(X(v.length-1),1)} ${pt+ih} L${round(X(0),1)} ${pt+ih} Z" fill="url(#${g})"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${round(X(v.length-1),1)}" cy="${round(Y(v[v.length-1].val),1)}" r="3.6" fill="${color}"/>
    <text x="${pl}" y="${h-4}" fill="#48484F" style="font:9px var(--mono)">${esc(fmtD(v[0].date))}</text>
    <text x="${w-pr}" y="${h-4}" text-anchor="end" fill="#48484F" style="font:9px var(--mono)">${esc(fmtD(v[v.length-1].date))}</text>
  </svg>`;
}
function streak(has){
  let s=0,d=today();
  for(let i=0;i<400;i++){
    if(has(d)) s++; else if(i===0){ d=addDays(d,-1); continue; } else break;
    d=addDays(d,-1);
  } return s;
}

/* ═══ TODAY ═══════════════════════════════════════════════════════ */
function vToday(){
  const d=today(), D=day(d), T=DB.t;
  const kc=kcalOf(), pr=protOf(), left=T.kcal-kc;
  const water=D.water||0, gal=round(water/128,2);
  const bottles=Math.max(0,Math.ceil((T.waterOz-water)/T.bottle));
  const wk=thisWeek();
  const lift=wk.filter(liftedOn).length, dr=wk.filter(x=>day(x).drums).length, gt=wk.filter(x=>day(x).guitar).length;
  const w=D.weight;
  const hv=DB.workouts.filter(x=>x.date===d);
  const h=DB.health[d]||{};

  return `

/* ═══ HEVY IMPORT (zip / csv / text) ══════════════════════════════ */
function hevyImportNow(){
  let i=$('hvF');
  if(!i){ i=document.createElement('input'); i.type='file'; i.id='hvF'; i.className='hidden'; document.body.appendChild(i); }
  i.onchange=e=>{ const f=e.target.files[0]; e.target.value=''; if(f) hevyFile(f); };
  i.click();
}
async function hevyFile(file){
  try{
    const buf=await file.arrayBuffer(), h=new Uint8Array(buf.slice(0,2));
    let text;
    if(h[0]===0x50&&h[1]===0x4B){ toast('Unzipping…'); text=await csvFromZip(buf);
      if(!text){ toast('No CSV inside that zip'); return; } }
    else text=new TextDecoder().decode(buf);
    if(/^\s*[[{]/.test(text)){ toast('That is JSON — export Workout Data (CSV)'); return; }
    hevyParse(text);
  }catch(e){ toast('Could not read that file'); }
}
async function csvFromZip(buf){
  const dv=new DataView(buf), u8=new Uint8Array(buf);
  let eocd=-1;
  for(let i=u8.length-22;i>=0&&i>u8.length-66000;i--) if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;}
  if(eocd<0) throw new Error('bad zip');
  const count=dv.getUint16(eocd+10,true); let off=dv.getUint32(eocd+16,true); const ent=[];
  for(let i=0;i<count;i++){
    if(dv.getUint32(off,true)!==0x02014b50) break;
    const method=dv.getUint16(off+10,true), csize=dv.getUint32(off+20,true);
    const nlen=dv.getUint16(off+28,true), mlen=dv.getUint16(off+30,true), klen=dv.getUint16(off+32,true);
    const lho=dv.getUint32(off+42,true);
    ent.push({name:new TextDecoder().decode(u8.slice(off+46,off+46+nlen)),method,csize,lho});
    off+=46+nlen+mlen+klen;
  }
  const p=ent.find(e=>/\.csv$/i.test(e.name))||ent.find(e=>!/\/$/.test(e.name));
  if(!p) return null;
  const ln=dv.getUint16(p.lho+26,true), lx=dv.getUint16(p.lho+28,true);
  const raw=u8.slice(p.lho+30+ln+lx, p.lho+30+ln+lx+p.csize);
  if(p.method===0) return new TextDecoder().decode(raw);
  if(typeof DecompressionStream==='undefined') throw new Error('cannot unzip here');
  return await new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
}
function parseCSV(t){
  const rows=[]; let row=[],cell='',q=false;
  for(let i=0;i<t.length;i++){ const c=t[i];
    if(q){ if(c==='"'){ if(t[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(cell); cell=''; }
    else if(c==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
    else if(c!=='\r') cell+=c;
  }
  if(cell||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.length>1);
}
function hDate(s){
  if(!s) return null;
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  m=s.match(/^(\d{1,2})\s+([A-Za-z]{3})\s+(\d{4})/);
  if(m){ const mo=MON.findIndex(x=>x.toLowerCase()===m[2].toLowerCase());
    if(mo>=0) return `${m[3]}-${String(mo+1).padStart(2,'0')}-${m[1].padStart(2,'0')}`; }
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m) return `${m[3]}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;
  const d=new Date(s); return isNaN(d)?null:ymd(d);
}
function hevyParse(text){
  const rows=parseCSV(text);
  if(rows.length<2){ toast('That file looks empty'); return; }
  const head=rows[0].map(x=>x.trim().toLowerCase().replace(/^"|"$/g,''));
  const col=(...n)=>{ for(const x of n){ const i=head.indexOf(x); if(i>=0) return i; } return -1; };
  const cT=col('title','workout_name'), cS=col('start_time','date'), cE=col('exercise_title','exercise_name','exercise'),
        cR=col('reps'), cKg=col('weight_kg'), cLb=col('weight_lbs','weight_lb');
  if(cE<0||cR<0||cS<0){ toast('Not a Hevy workout export'); return; }
  const by={};
  for(let i=1;i<rows.length;i++){
    const r=rows[i]; if(!r[cS]) continue;
    const date=hDate(r[cS].trim()); if(!date) continue;
    const key='csv:'+r[cS].trim();
    const w=by[key]||(by[key]={key,date,title:cT>=0?r[cT]:'Workout',ex:[]});
    const reps=Number(r[cR]); if(!reps) continue;
    const kg=cKg>=0&&r[cKg]!==''?Number(r[cKg]):cLb>=0&&r[cLb]!==''?Number(r[cLb])/KG_TO_LB:0;
    const nm=(r[cE]||'Exercise').trim();
    let e=w.ex.find(x=>x.name===nm); if(!e){ e={name:nm,sets:[]}; w.ex.push(e); }
    e.sets.push({kg:isNaN(kg)?0:kg,r:reps});
  }
  const list=Object.values(by); let added=0;
  const toLb=DB.t.unit==='lb';
  list.forEach(w=>{
    if(DB.workouts.some(x=>x.hv===w.key)) return;
    const ex=w.ex.map(e=>({name:e.name,sets:e.sets.map(s=>({w:round(s.kg*(toLb?KG_TO_LB:1),1),r:s.r}))}));
    DB.workouts.push({id:uid(),hv:w.key,date:w.date,name:w.title||'Workout',ex});
    added++;
  });
  DB.workouts.sort((a,b)=>a.date.localeCompare(b.date));
  save();
  toast(added?`Imported ${added} workout${added===1?'':'s'}`:`All ${list.length} already imported`);
}

        Google Health → profile icon → <b>Partner apps</b> → <b>Apple Health</b> → allow everything.</div>
    </div>
    <div class="card" style="margin-bottom:14px">
      <div class="lbl" style="margin-bottom:9px">Then</div>
      <div class="sub2" style="line-height:1.7;color:var(--text-2)">
        Health app → profile picture → <b>Export All Health Data</b> → save the zip, load it below.</div>
    </div>
    <button class="btn primary block" onclick="ahPick()">Choose Health export</button>
    <div id="ahOut" class="sub2" style="margin-top:12px;min-height:18px;line-height:1.6"></div>
    <button class="btn block mt" onclick="close()">Close</button>`);
}
function ahPick(){
  let i=$('ahF');
  if(!i){ i=document.createElement('input'); i.type='file'; i.id='ahF'; i.className='hidden'; document.body.appendChild(i); }
  i.onchange=e=>{ const f=e.target.files[0]; e.target.value=''; if(f) ahRead(f); };
  i.click();
}
async function zipEntry(file,match){
  const tl=Math.min(66000,file.size);
  const tail=new Uint8Array(await file.slice(file.size-tl).arrayBuffer());
  const tv=new DataView(tail.buffer); let e=-1;
  for(let i=tail.length-22;i>=0;i--) if(tv.getUint32(i,true)===0x06054b50){e=i;break;}
  if(e<0) throw new Error('not a zip');
  const count=tv.getUint16(e+10,true), cdOff=tv.getUint32(e+16,true), cdLen=tv.getUint32(e+12,true);
  const cd=new Uint8Array(await file.slice(cdOff,cdOff+cdLen).arrayBuffer()), cv=new DataView(cd.buffer);
  let off=0;
  for(let i=0;i<count;i++){
    if(cv.getUint32(off,true)!==0x02014b50) break;
    const method=cv.getUint16(off+10,true), csize=cv.getUint32(off+20,true);
    const nlen=cv.getUint16(off+28,true), mlen=cv.getUint16(off+30,true), klen=cv.getUint16(off+32,true);
    const lho=cv.getUint32(off+42,true);
    const name=new TextDecoder().decode(cd.slice(off+46,off+46+nlen));
    if(match(name)){
      const lh=new DataView(await file.slice(lho,lho+30).arrayBuffer());
      const st=lho+30+lh.getUint16(26,true)+lh.getUint16(28,true);
      return {method,blob:file.slice(st,st+csize)};
    }
    off+=46+nlen+mlen+klen;
  }
  return null;
}
async function ahRead(file){
  const out=(m,c)=>{ const el=$('ahOut'); if(el){ el.innerHTML=m; el.style.color=c||'var(--text-3)'; } };
  out('Opening…');
  try{
    let stream;
    const h=new Uint8Array(await file.slice(0,2).arrayBuffer());
    if(h[0]===0x50&&h[1]===0x4B){
      const e=await zipEntry(file,n=>/export\.xml$/i.test(n));
      if(!e) throw new Error('no export.xml inside');
      stream = e.method===0 ? e.blob.stream()
        : e.blob.stream().pipeThrough(new DecompressionStream('deflate-raw'));
    } else stream=file.stream();
    const rd=stream.pipeThrough(new TextDecoderStream('utf-8',{fatal:false})).getReader();
    const RE=/<Record\s+type="([^"]+)"[^>]*?(?:unit="([^"]*)")?[^>]*?startDate="([^"]+)"[^>]*?endDate="([^"]+)"[^>]*?value="([^"]*)"/g;
    const acc={}; let buf='',n=0,matched=0;
    const flush=end=>{
      RE.lastIndex=0; let m,last=0;
      while((m=RE.exec(buf))){
        last=RE.lastIndex; const key=AH[m[1]]; if(!key) continue; matched++;
        const day=(key==='sleep'?m[4]:m[3]).slice(0,10);
        if(!/^\d{4}-\d{2}-\d{2}$/.test(day)) continue;
        const a=acc[day]||(acc[day]={steps:0,rhr:[],sleepMs:0,weight:null,wu:''});
        if(key==='steps') a.steps+=Number(m[5])||0;
        else if(key==='rhr') a.rhr.push(Number(m[5])||0);
        else if(key==='weight'){ a.weight=Number(m[5])||null; a.wu=(m[2]||'').toLowerCase(); }
        else if(key==='sleep'&&/Asleep/i.test(m[5])){
          const ms=new Date(m[4])-new Date(m[3]);
          if(ms>0&&ms<20*3600e3) a.sleepMs+=ms;
        }
      }
      buf=end?'':buf.slice(Math.max(0,last-400));
    };
    for(;;){ const {done,value}=await rd.read(); if(done) break;
      buf+=value; n+=value.length;
      if(buf.length>400000){ flush(false); out('Reading… '+round(n/1e6)+' MB'); } }
    flush(true);
    let days=0,ws=0;
    for(const dt in acc){
      const a=acc[dt], rec={...(DB.health[dt]||{})}; let touched=false;
      if(a.steps>0){ rec.steps=Math.round(a.steps); touched=true; }
      if(a.rhr.length){ rec.rhr=Math.round(avg(a.rhr)); touched=true; }
      if(a.sleepMs>0){ rec.sleep=round(a.sleepMs/3600e3,1); touched=true; }
      if(touched){ DB.health[dt]=rec; days++; }
      if(a.weight && !(DB.day[dt]||{}).weight){
        const kg=/lb/.test(a.wu)?a.weight/KG_TO_LB:a.weight;
        const d2={...(DB.day[dt]||{})}; d2.weight=round(DB.t.unit==='lb'?kg*KG_TO_LB:kg,1);
        DB.day[dt]=d2; ws++;
      }
    }
    save();
    if(!days&&!ws){ out('Read it, but found nothing. Export from the <b>Health</b> app itself.','var(--bad)'); return; }
    out(`<b>Imported ${days} day${days===1?'':'s'}</b>${ws?` and ${ws} weigh-in${ws===1?'':'s'}`:''} from ${matched.toLocaleString()} records.`,'var(--lift)');
  }catch(e){ out('Could not read that: '+esc(e.message),'var(--bad)'); }
}

/* ═══ ROUTER ══════════════════════════════════════════════════════ */
let TAB='today';
function go(t){ TAB=t; render(); window.scrollTo({top:0,behavior:'smooth'}); haptic(); }
function render(){
  $('main').innerHTML = TAB==='today' ? vToday() : vWeek();
  $('nToday').className = TAB==='today'?'active':'';
  $('nWeek').className  = TAB==='week'?'active':'';
  const d=today(), dt=new Date(d+'T12:00:00');
  if(TAB==='today'){
    $('hTitle').textContent='Today';
    const done=[liftedOn(d),!!day(d).drums,!!day(d).guitar,(day(d).water||0)>=DB.t.waterOz,kcalOf(d)>=DB.t.kcal*.95].filter(Boolean).length;
    $('hSub').textContent=`${DOWL[dt.getDay()]} ${MON[dt.getMonth()]} ${dt.getDate()} · ${done}/5 done`;
  } else {
    $('hTitle').textContent='This week';
    const wk=thisWeek();
    $('hSub').textContent=`${fmtD(wk[0])} – ${fmtD(wk[6])}`;
  }
}

/* keep the deployed build in front of any cached copy */
(async function selfUpdate(){
  if(location.protocol==='file:') return;
  try{
    if('caches' in window){
      const ks=await caches.keys();
      await Promise.all(ks.map(async k=>{ const c=await caches.open(k);
        await c.delete(location.pathname); await c.delete(location.href); }));
    }
    const r=await fetch(location.pathname+'?_='+Date.now(),{cache:'reload'});
    if(!r.ok) return;
    const m=(await r.text()).match(/const BUILD = '([^']+)'/);
    if(!m||m[1]===BUILD) return;
    const f='nb_'+m[1]; if(sessionStorage.getItem(f)) return;
    sessionStorage.setItem(f,'1'); location.reload();
  }catch(e){}
})();

load(); render();
setInterval(()=>{ if(today()!==render._d){ render._d=today(); render(); } },60000);
render._d=today();
</script>
